<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-label="">
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="0.58" stop-color="#f2e6c9"/>
      <stop offset="1" stop-color="#d9b974"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b8d90"/>
      <stop offset="1" stop-color="#074e59"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#082f3a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <style>
    .horse { transform-origin: 120px 88px; animation: body-bob .64s ease-in-out infinite; }
    .leg { transform-box: fill-box; transform-origin: 50% 8%; }
    .hind-far { animation: hind-far .64s ease-in-out infinite; }
    .hind-near { animation: hind-near .64s ease-in-out infinite; }
    .front-far { animation: front-far .64s ease-in-out infinite; }
    .front-near { animation: front-near .64s ease-in-out infinite; }
    .tail { transform-box: fill-box; transform-origin: 100% 50%; animation: tail-sway .64s ease-in-out infinite; }
    @keyframes body-bob {
      0%, 100% { transform: translateY(2px); }
      12.5% { transform: translateY(0); }
      25% { transform: translateY(-3px); }
      37.5% { transform: translateY(-4px); }
      50% { transform: translateY(-2px); }
      62.5% { transform: translateY(1px); }
      75% { transform: translateY(3px); }
      87.5% { transform: translateY(2px); }
    }
    @keyframes hind-far {
      0%, 100% { transform: rotate(-25deg); }
      12.5% { transform: rotate(-10deg); }
      25% { transform: rotate(8deg); }
      37.5% { transform: rotate(24deg); }
      50% { transform: rotate(32deg); }
      62.5% { transform: rotate(18deg); }
      75% { transform: rotate(0deg); }
      87.5% { transform: rotate(-18deg); }
    }
    @keyframes hind-near {
      0%, 100% { transform: rotate(24deg); }
      12.5% { transform: rotate(10deg); }
      25% { transform: rotate(-8deg); }
      37.5% { transform: rotate(-24deg); }
      50% { transform: rotate(-32deg); }
      62.5% { transform: rotate(-18deg); }
      75% { transform: rotate(0deg); }
      87.5% { transform: rotate(18deg); }
    }
    @keyframes front-far {
      0%, 100% { transform: rotate(28deg); }
      12.5% { transform: rotate(12deg); }
      25% { transform: rotate(-6deg); }
      37.5% { transform: rotate(-21deg); }
      50% { transform: rotate(-29deg); }
      62.5% { transform: rotate(-16deg); }
      75% { transform: rotate(0deg); }
      87.5% { transform: rotate(20deg); }
    }
    @keyframes front-near {
      0%, 100% { transform: rotate(-28deg); }
      12.5% { transform: rotate(-12deg); }
      25% { transform: rotate(6deg); }
      37.5% { transform: rotate(21deg); }
      50% { transform: rotate(29deg); }
      62.5% { transform: rotate(16deg); }
      75% { transform: rotate(0deg); }
      87.5% { transform: rotate(-20deg); }
    }
    @keyframes tail-sway {
      0%, 100% { transform: rotate(-5deg); }
      25% { transform: rotate(6deg); }
      50% { transform: rotate(11deg); }
      75% { transform: rotate(2deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .horse, .leg, .tail { animation: none; }
    }
  </style>
  <ellipse cx="121" cy="137" rx="81" ry="7" fill="#0b6069" opacity="0.16"/>
  <g class="horse" filter="url(#shadow)">
    <path class="tail" d="M66 75C47 59 31 65 15 83c13 1 19 5 27 12-12 0-18 3-24 10 22 2 37-3 49-15z" fill="url(#teal)" stroke="#07515b" stroke-width="3" stroke-linejoin="round"/>
    <g class="leg hind-far">
      <path d="M84 94L60 116l-10 20" fill="none" stroke="#0a5964" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M50 136l-10 2" fill="none" stroke="#083a46" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g class="leg front-far">
      <path d="M157 94l21 24 11 18" fill="none" stroke="#0a5964" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M189 136l10 1" fill="none" stroke="#083a46" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g class="leg hind-near">
      <path d="M102 96l13 23-8 19" fill="none" stroke="url(#coat)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M111 128l-4 10" fill="none" stroke="#0a5964" stroke-width="9" stroke-linecap="round"/>
      <path d="M107 138l-10 2" fill="none" stroke="#083a46" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g class="leg front-near">
      <path d="M166 94l-12 26-2 18" fill="none" stroke="url(#coat)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M154 128l-2 10" fill="none" stroke="#0a5964" stroke-width="9" stroke-linecap="round"/>
      <path d="M152 138l-10 2" fill="none" stroke="#083a46" stroke-width="8" stroke-linecap="round"/>
    </g>
    <path d="M55 84c-2-15 12-28 35-30 22-10 47-8 63 6 19 7 28 20 27 33-2 15-18 22-39 20-24 8-60 5-80-7-9-5-10-14-6-22z" fill="url(#coat)" stroke="#07515b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M148 77c-2-20 2-44 17-58 8-8 20-6 24 4l8 7c7 6 5 17-4 21l-15-3c-2 16 1 30-2 43z" fill="url(#coat)" stroke="#07515b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M151 58c0-19 6-37 18-47 11-9 20-5 25 5-12-3-19 0-25 10-4 8-6 19-5 33z" fill="url(#teal)" stroke="#07515b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M165 17l1-12 8 11m7-2 7-8 1 13" fill="url(#coat)" stroke="#07515b" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="188" cy="31" r="2.6" fill="#0b2d36"/>
    <path d="M197 43l-8 2" stroke="#07515b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M77 68c12-8 24-11 38-11" fill="none" stroke="#fffdf4" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
